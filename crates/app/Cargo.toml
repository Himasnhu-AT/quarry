[package]
name = "quarry"
description = "Quarry: a fast database browser an AI agent can use safely"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "quarry"

[lints]
workspace = true

[lib]
name = "quarry"
path = "src/lib.rs"

[[bin]]
name = "quarry"
path = "src/main.rs"

[[bin]]
name = "quarry-cli"
path = "src/bin/quarry-cli.rs"

[dependencies]
quarry-core = { workspace = true }
quarry-guard = { workspace = true }
quarry-engine = { workspace = true }
quarry-viz = { workspace = true }
ashlar = { workspace = true }
ashlar-diff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# the OS keychain for connection passwords (`ashlar-rs` does not enable `secrets`)
ashlar-native = { version = "0.2", default-features = false, features = ["secrets"] }

[dev-dependencies]
tempfile = { workspace = true }
# a small fixture database for the shell's `.ui` script test
# and grid golden snapshots of one region (`Driver::check_snapshot`) and the fixture bench
ashlar-debug = "0.2"
rusqlite = { workspace = true }
